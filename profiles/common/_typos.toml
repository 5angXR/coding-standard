# coding-standard 统一词汇与命名缩写规则 (GEN-NAM-04)
# 由 typos 工具执行自动化检查与一键修复 (https://github.com/crate-ci/typos)

[default.extend-words]
# 常见词汇强制缩写映射: 全拼 -> 规范缩写
button = "btn"
count = "cnt"
event = "evt"
buffer = "buf"
length = "len"
config = "cfg"
message = "msg"
context = "ctx"
device = "dev"
number = "num"
pointer = "ptr"
string = "str"
value = "val"
initialize = "init"
calculate = "calc"
arguments = "args"

[files]
# 排除文档、变更记录与 Markdown 文件，防止普通英文写作与说明性文本被误伤
extend-exclude = [
    "*.md",
    "docs/**",
    "LICENSE",
]

