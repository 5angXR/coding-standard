name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover tests

  lint-and-format:
    name: Lint & Punctuation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Chinese Punctuation (punct-converter)
        run: |
          cargo install punct-converter --locked
          punct-converter -r .
          git diff --exit-code || (echo "Found unconverted Chinese punctuation. Please run 'punct-converter -r .' locally." && exit 1)

